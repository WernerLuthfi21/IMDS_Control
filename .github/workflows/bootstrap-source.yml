name: Bootstrap application source
on:
  push:
    branches: [main]
    paths:
      - "bootstrap/IMDS_Control_Source.tar.xz"
permissions:
  contents: write
jobs:
  expand-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Reassemble private application source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/imds-source
          cat bootstrap/chunks/part-*.b64 | base64 --decode > /tmp/IMDS_Control_Source.tar.xz
          xz -t /tmp/IMDS_Control_Source.tar.xz
          tar -tJf /tmp/IMDS_Control_Source.tar.xz >/dev/null
          tar -xJf /tmp/IMDS_Control_Source.tar.xz -C /tmp/imds-source
          cp -a /tmp/imds-source/. .
          rm -rf bootstrap
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npm run test:e2e
      - name: Commit expanded source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add IMDS G-CATS v0.2.2 application source"
          git push
