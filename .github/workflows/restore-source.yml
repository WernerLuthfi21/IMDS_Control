name: Restore application source and validate

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/IMDS_Control_source.tar.gz"

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/imds-source
          tar -xzf bootstrap/IMDS_Control_source.tar.gz -C /tmp/imds-source
          cp -a /tmp/imds-source/. .
          rm -rf bootstrap

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore IMDS G-CATS application source"
          git push

      - name: Install project package manager
        run: npm install --global npm@11.21.1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
